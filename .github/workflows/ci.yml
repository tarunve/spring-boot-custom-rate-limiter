  name: CI - Build, Test & Publish

  on:
    pull_request:
      branches:
        - "**"

    push:
      branches:
        - main
        - master
      tags:
        - "v*"

  permissions:
    contents: write
    pull-requests: write
    actions: read

  # Prevent two publishing jobs from running at the same time.
  # This is important because both jobs could otherwise calculate
  # the same incremental version.
  concurrency:
    group: maven-central-publishing
    cancel-in-progress: false

  jobs:
    build:
      name: Build, Test & Publish
      runs-on: ubuntu-latest

      steps:

        # ==========================================================
        # CHECKOUT
        # ==========================================================
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
            fetch-tags: true

        # ==========================================================
        # JAVA 17
        # ==========================================================
        - name: Set up JDK 17
          uses: actions/setup-java@v6
          with:
            java-version: "17"
            distribution: "temurin"
            cache: maven

            # Maven Central credentials are written into
            # ~/.m2/settings.xml by setup-java.
            server-id: central
            server-username: MAVEN_USERNAME
            server-password: MAVEN_PASSWORD

        # ==========================================================
        # VERIFY JAVA / MAVEN
        # ==========================================================
        - name: Verify Java and Maven
          run: |
            echo "Java version:"
            java -version
            
            echo ""
            echo "Maven version:"
            mvn -version

        # ==========================================================
        # BUILD + TEST
        # ==========================================================
        #
        # IMPORTANT:
        # Nothing is published if this step fails.
        #
        - name: Build and test with Maven
          id: maven_build
          run: |
            mvn clean verify \
              --batch-mode \
              --no-transfer-progress \
              -Dgpg.skip=true

        # ==========================================================
        # DETERMINE VERSION
        # ==========================================================
        #
        # NORMAL PUSH:
        #
        # POM:
        #   1.0.4
        #
        # Existing tags:
        #   v1.0.4.1
        #   v1.0.4.2
        #
        # Next version:
        #   1.0.4.3
        #
        #
        # OFFICIAL RELEASE:
        #
        # Git tag:
        #   v1.0.5
        #
        # POM:
        #   1.0.5
        #
        # Published version:
        #   1.0.5
        #
        - name: Determine publish version
          if: steps.maven_build.outcome == 'success' &&
            github.event_name == 'push'
          id: version
          shell: bash
          run: |
            
            # ------------------------------------------------------
            # Read version from Maven
            # ------------------------------------------------------
            
            POM_VERSION=$(mvn help:evaluate \
              -Dexpression=project.version \
              -q \
              -DforceStdout)
            
            POM_VERSION="${POM_VERSION%-SNAPSHOT}"
            
            echo "POM base version: $POM_VERSION"
            
            # ------------------------------------------------------
            # OFFICIAL RELEASE
            #
            # Example:
            #   v1.0.5
            #
            # Publishes:
            #   1.0.5
            # ------------------------------------------------------
            
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            
              RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            
              echo "Release tag detected: ${GITHUB_REF_NAME}"
              echo "Release version: ${RELEASE_VERSION}"
            
              # Make sure the tag version matches the POM version.
              if [[ "$RELEASE_VERSION" != "$POM_VERSION" ]]; then
                echo "::error::Release tag ${RELEASE_VERSION} does not match POM version ${POM_VERSION}"
                exit 1
              fi
            
              echo "new_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            
            # ------------------------------------------------------
            # NORMAL MAIN / MASTER PUSH
            #
            # Example:
            #
            # POM:
            #   1.0.4
            #
            # Existing:
            #   v1.0.4.1
            #   v1.0.4.2
            #   v1.0.4.3
            #
            # Next:
            #   1.0.4.4
            # ------------------------------------------------------
            
            else
            
              PREFIX="v${POM_VERSION}."
            
              echo "Looking for existing tags matching:"
              echo "${PREFIX}*"
            
              # Get all tags.
              #
              # '|| true' prevents the workflow from failing when
              # there are no matching tags.
              TAGS=$(git tag --list "${PREFIX}*" || true)
            
              LATEST_SUFFIX=""
            
              # ----------------------------------------------------
              # Find highest numeric suffix.
              #
              # We intentionally do not use grep here because
              # GitHub Actions runs bash with:
              #
              #   -e -o pipefail
              #
              # and grep returns exit code 1 when there are
              # no matches.
              # ----------------------------------------------------
            
              while IFS= read -r TAG; do
            
                # Ignore empty lines.
                [ -z "$TAG" ] && continue
            
                SUFFIX="${TAG#${PREFIX}}"
            
                # Only accept numeric suffixes.
                if [[ "$SUFFIX" =~ ^[0-9]+$ ]]; then
            
                  if [ -z "$LATEST_SUFFIX" ] || \
                     [ "$SUFFIX" -gt "$LATEST_SUFFIX" ]; then
            
                    LATEST_SUFFIX="$SUFFIX"
            
                  fi
            
                fi
            
              done <<< "$TAGS"
            
              # ----------------------------------------------------
              # Calculate next version.
              # ----------------------------------------------------
            
              if [ -z "$LATEST_SUFFIX" ]; then
                NEXT_SUFFIX=1
              else
                NEXT_SUFFIX=$((LATEST_SUFFIX + 1))
              fi
            
              NEW_VERSION="${POM_VERSION}.${NEXT_SUFFIX}"
            
              echo "Latest CI suffix: ${LATEST_SUFFIX:-none}"
              echo "Next CI version: ${NEW_VERSION}"
            
              echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
            
            fi

        # ==========================================================
        # SET MAVEN VERSION
        # ==========================================================
        #
        # This changes the version only in the GitHub Actions
        # workspace. It does NOT commit the changed POM files.
        #
        - name: Set publish version
          if: steps.maven_build.outcome == 'success' &&
            steps.version.outputs.new_version != ''
          run: |
            
            NEW_VERSION="${{ steps.version.outputs.new_version }}"
            
            echo "Setting Maven version to:"
            echo "$NEW_VERSION"
            
            mvn versions:set \
              -DnewVersion="${NEW_VERSION}" \
              -DgenerateBackupPoms=false \
              --batch-mode \
              --no-transfer-progress
            
            echo ""
            echo "Final Maven version:"
            mvn help:evaluate \
              -Dexpression=project.version \
              -q \
              -DforceStdout

        # ==========================================================
        # IMPORT GPG KEY
        # ==========================================================
        #
        # Only import GPG for actual publishing.
        #
        - name: Import GPG key
          if: steps.maven_build.outcome == 'success' &&
            github.event_name == 'push'
          uses: crazy-max/ghaction-import-gpg@v6
          with:
            gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
            passphrase: ${{ secrets.GPG_PASSPHRASE }}

        # ==========================================================
        # PUBLISH TO MAVEN CENTRAL
        # ==========================================================
        #
        # This runs only after:
        #
        #   Build SUCCESS
        #   Tests SUCCESS
        #   Version calculated
        #   GPG imported
        #
        - name: Publish to Maven Central
          if: steps.maven_build.outcome == 'success' &&
            github.event_name == 'push'
          run: |
            
            NEW_VERSION="${{ steps.version.outputs.new_version }}"
            
            echo "=========================================="
            echo "Publishing Maven version: ${NEW_VERSION}"
            echo "=========================================="
            
            mvn deploy \
              --batch-mode \
              --no-transfer-progress

          env:
            MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
            MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
            MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

        # ==========================================================
        # CREATE INCREMENTAL VERSION TAG
        # ==========================================================
        #
        # Only normal pushes create a new CI tag.
        #
        # Example:
        #
        # Maven version:
        #   1.0.4.1
        #
        # Git tag:
        #   v1.0.4.1
        #
        # Official release v1.0.5 already has its own tag,
        # therefore we do NOT create another tag here.
        #
        - name: Create CI version tag
          if: steps.maven_build.outcome == 'success' &&
            github.event_name == 'push' &&
            steps.version.outputs.release == 'false'
          run: |
            
            NEW_VERSION="${{ steps.version.outputs.new_version }}"
            
            echo "Creating Git tag:"
            echo "v${NEW_VERSION}"
            
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git tag "v${NEW_VERSION}"
            
            git push origin "v${NEW_VERSION}"

        # ==========================================================
        # PR FAILURE COMMENT
        # ==========================================================
        #
        - name: Comment on PR if build failed
          if: always() &&
            steps.maven_build.outcome == 'failure' &&
            github.event_name == 'pull_request'
          uses: actions/github-script@v7
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ Build Failed
              
              The build or tests failed.
              
              [View failed run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
              })

        # ==========================================================
        # AI FIX AGENT
        # ==========================================================
        #
        # Keep this section only if your repository already uses
        # github-daily-digest for the AI fix workflow.
        #
        - name: Trigger AI Fix Agent on failure
          if: always() &&
            steps.maven_build.outcome == 'failure' &&
            github.event_name == 'pull_request'
          uses: actions/github-script@v7
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
              await github.rest.repos.createDispatchEvent({
                owner: "tarunve",
                repo: "github-daily-digest",
                event_type: "build-failed",
                client_payload: {
                  repo: context.repo.owner + "/" + context.repo.repo,
                  pr_number: String(context.issue.number),
                  pr_branch: context.payload.pull_request.head.ref,
                  run_id: context.runId.toString()
                }
              });

        # ==========================================================
        # FAIL JOB IF BUILD FAILED
        # ==========================================================
        #
        # Explicitly mark the workflow as failed.
        #
        - name: Fail the job if build failed
          if: always() &&
            steps.maven_build.outcome == 'failure'
          run: exit 1
