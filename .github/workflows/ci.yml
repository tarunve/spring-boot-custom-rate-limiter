name: CI - Build & Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

# Minimal permissions following principle of least privilege
permissions:
  contents: read        # checkout code
  pull-requests: write  # post comments on PRs
  actions: read         # read workflow run details

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test with Maven
        id: maven_build
        run: mvn clean verify --no-transfer-progress
        continue-on-error: true

      - name: Comment on PR if build failed
        if: steps.maven_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Build Failed\n\nThe dependency update caused a build/test failure. The **AI Fix Agent** has been triggered and will raise a fix PR shortly.\n\n[View failed run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
            })

      - name: Trigger AI Fix Agent on failure
        if: steps.maven_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "tarunve",
              repo: "github-daily-digest",
              event_type: "build-failed",
              client_payload: {
                repo: context.repo.owner + "/" + context.repo.repo,
                pr_number: String(context.issue.number),
                pr_branch: context.payload.pull_request.head.ref,
                run_id: context.runId.toString()
              }
            });

      - name: Fail the job if build failed
        if: steps.maven_build.outcome == 'failure'
        run: exit 1