name: CI - Build & Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test with Maven
        id: maven_build
        run: mvn clean verify --no-transfer-progress
        continue-on-error: true

      - name: Comment on PR if build failed
        if: steps.maven_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Build Failed\n\nThe dependency update in this PR caused a build/test failure.\n\n**Action needed:** Please review the [failed workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\nThis PR should **not be merged** until the issue is resolved.`
            })

      - name: Fail the job if build failed
        if: steps.maven_build.outcome == 'failure'
        run: exit 1