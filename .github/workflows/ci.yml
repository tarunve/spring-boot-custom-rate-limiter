  name: CI - Build, Test & Publish

  on:
    pull_request:
      branches: ["**"]

    push:
      branches:
        - main
        - master

  permissions:
    contents: read
    pull-requests: write
    actions: read

  jobs:
    build:
      name: Build and Test
      runs-on: ubuntu-latest

      steps:
        # ---------------------------------------------------------
        # 1. Checkout
        # ---------------------------------------------------------
        - name: Checkout code
          uses: actions/checkout@v4

        # ---------------------------------------------------------
        # 2. Setup Java 17 + Maven Central credentials
        # ---------------------------------------------------------
        - name: Set up JDK 17
          uses: actions/setup-java@v5
          with:
            java-version: "17"
            distribution: "temurin"
            cache: maven

            # Maven Central server configuration
            server-id: central
            server-username: MAVEN_USERNAME
            server-password: MAVEN_PASSWORD

        # ---------------------------------------------------------
        # 3. Verify Java/Maven
        # ---------------------------------------------------------
        - name: Verify Java and Maven
          run: |
            java -version
            mvn -version

        # ---------------------------------------------------------
        # 4. Build and test
        #
        # GPG is intentionally skipped here.
        # Pull requests should NOT require the signing key.
        # ---------------------------------------------------------
        - name: Build and test with Maven
          id: maven_build
          run: |
            mvn clean verify \
              --batch-mode \
              --no-transfer-progress \
              -Dgpg.skip=true

        # ---------------------------------------------------------
        # 5. Import GPG key
        #
        # Only required when publishing to Maven Central.
        # ---------------------------------------------------------
        - name: Import GPG key
          if: github.event_name == 'push' && steps.maven_build.outcome == 'success'
          uses: crazy-max/ghaction-import-gpg@v6
          with:
            gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
            passphrase: ${{ secrets.GPG_PASSPHRASE }}

        # ---------------------------------------------------------
        # 6. Publish to Maven Central
        # ---------------------------------------------------------
        - name: Publish to Maven Central
          if: github.event_name == 'push' && steps.maven_build.outcome == 'success'
          run: |
            mvn deploy \
              --batch-mode \
              --no-transfer-progress
          env:
            MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
            MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
            MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

        # ---------------------------------------------------------
        # 7. Comment on PR when build fails
        # ---------------------------------------------------------
        - name: Comment on PR if build failed
          if: always() && steps.maven_build.outcome == 'failure' && github.event_name == 'pull_request'
          uses: actions/github-script@v7
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ Build Failed
              
              The build or tests failed.
              
              [View failed run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
              })

        # ---------------------------------------------------------
        # 8. Trigger AI Fix Agent
        # --------------------------------------------
